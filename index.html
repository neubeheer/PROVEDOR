<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Monte seu provedor de internet: torres de rádio, fibra, porta a porta, equipe e expansão por cidades.">
<meta name="theme-color" content="#1e2a30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Provedor Tycoon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Provedor Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: prédio da empresa (esq.) · mapa da cidade em bairros (centro) · missões, relatório e registro (dir.); no celular, abas. Visual diurno único, de propósito. */
:root{
  --bg:#e6ede3; --panel:#fffdf8; --ink:#1e2a30; --muted:#5b6a6f; --line:#d3dccf;
  --grass:#a3cf78; --grass-cov:#7dcfae; --road:#58636b; --stripe:#e8d27a;
  --roof:#b5482e; --door:#6b4a32; --window:#cdeaf5; --facade:#efe2c9; --facade-line:#d9c8a6;
  --accent:#f0661a; --accent-dark:#c74e0f; --accent-ink:#ffffff;
  --signal:#0f9a8d; --signal-soft:#d4f1ea; --danger:#cf3b3b; --danger-soft:#fbe3df; --gold:#e5a21e; --gold-soft:#fbefd0;
  --device:#16222a; --device-2:#1f2f38; --device-ink:#d6f2ea; --device-dim:#8aa7a5; --device-line:#2f434d;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted);margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--display);font-size:18px;font-weight:400;line-height:1;letter-spacing:.02em}
.brand small{display:block;font-size:12px;color:#b9c7c9;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.stat{background:#2b3a41;border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;min-width:78px;border:0;text-align:left;color:#fff}
button.stat{cursor:pointer}
button.stat:hover{background:#34464e}
.stat b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a9babd;font-weight:700}
.stat.money b{color:#ffd27a}
.stat.neg b{color:#ff9c8f}
.bar{height:4px;background:#46575e;border-radius:4px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal)}
.speed{display:flex;background:#2b3a41;border-radius:10px;padding:3px;gap:2px}
.speed button{border:0;background:transparent;color:#cfdadb;padding:5px 9px;border-radius:7px;cursor:pointer;font-weight:800;font-size:13px}
.speed button[aria-pressed="true"]{background:var(--accent);color:#fff}
.icon-btn{border:0;background:#2b3a41;color:#fff;border-radius:10px;height:38px;padding:0 11px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.save-dot{width:8px;height:8px;border-radius:50%;background:#8aa7a5}
.save-dot.cloud{background:#3ddc97}
.save-dot.err{background:#ff9c8f}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr) 320px;gap:16px;padding-inline:16px;padding-block:16px 24px;max-width:1460px;margin:0 auto;align-items:start}
.pane{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:15px;font-weight:800;margin-bottom:8px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card-head h3{margin:0}
.building{display:flex;flex-direction:column;align-items:stretch}
.roof{display:flex;justify-content:center;align-items:flex-end;height:74px}
.roof svg{height:74px}
.sign{background:var(--accent);color:#fff;font-family:var(--display);font-size:13px;text-align:center;padding:6px 8px;border-radius:8px 8px 0 0;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.floor{background:var(--facade);border-inline:6px solid var(--facade-line);border-top:4px solid var(--facade-line);padding:10px 10px 10px 12px;display:flex;flex-direction:column;gap:6px}
.floor-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.floor-name{font-weight:800}
.floor-name small{display:block;font-weight:700;color:var(--muted);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
.floor-lvl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;text-align:right}
.floor-desc{font-size:12.5px;color:var(--muted);margin:0}
.windows{display:flex;gap:6px;align-items:center;min-height:26px}
.win{width:26px;height:24px;border-radius:3px;background:var(--window);border:2px solid #fff;display:grid;place-items:end center;overflow:hidden}
.win.empty{opacity:.55}
.person{width:12px;height:16px;position:relative}
.person::before{content:"";position:absolute;left:3px;top:0;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.person::after{content:"";position:absolute;left:1px;top:7px;width:10px;height:9px;border-radius:5px 5px 0 0;background:var(--signal)}
.floor.locked{background:repeating-linear-gradient(135deg,#e6e0d2 0 10px,#ddd5c3 10px 20px)}
.floor.locked .floor-name{color:var(--muted)}
.floor.soon{background:repeating-linear-gradient(135deg,#dfe7ea 0 10px,#d3dee2 10px 20px)}
.floor.ground{border-bottom:6px solid var(--facade-line)}
.floor-actions{display:flex;gap:6px;flex-wrap:wrap}
.door{height:18px;background:var(--facade-line);border-radius:0 0 6px 6px;margin-inline:30%}
.empty-building{text-align:center;padding:18px 8px;color:var(--muted)}
.empty-building svg{width:90px;margin:0 auto 8px;display:block}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;background:#e4ebe2;color:var(--ink);font-size:13.5px;line-height:1.2}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-dark)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.signal{background:var(--signal);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.map-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.map-head h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.05}
.map-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;background:#e8eee6;white-space:nowrap}
.chip.ok{background:var(--signal-soft);color:#08665d}
.chip.warn{background:var(--gold-soft);color:#7a5408}
.chip.bad{background:var(--danger-soft);color:#962323}
.sede-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.sede-bar p{margin:0;font-size:14px}
.sede-actions{display:flex;flex-wrap:wrap;gap:6px}
.map-wrap{max-width:640px;margin:0 auto}
.map{display:grid;grid-template-columns:repeat(3,1fr) .42fr repeat(3,1fr) .42fr repeat(3,1fr);grid-template-rows:repeat(3,1fr) .42fr repeat(3,1fr) .42fr repeat(3,1fr);gap:3px;aspect-ratio:1;max-width:100%;background:var(--road);padding:6px;border-radius:14px;position:relative;
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),var(--stripe) calc(50% - 1px),var(--stripe) calc(50% + 1px),transparent calc(50% + 1px))}
.lot{border:0;padding:0;border-radius:5px;background:var(--grass);display:grid;place-items:center;cursor:pointer;position:relative;min-width:0;transition:transform .12s}
button.lot:hover{transform:translateY(-2px)}
div.lot{cursor:default}
.lot svg{width:86%;height:86%}
.lot.cov{background:var(--grass-cov)}
.lot.refused svg{opacity:.45;filter:grayscale(.8)}
.lot.pending{outline:3px dashed var(--accent);outline-offset:-3px}
.lot.client::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 2px #fff}
.lot.overload.client::after{background:var(--danger)}
.lot.tower{background:#cfd9c4}
.lot.off svg{filter:grayscale(1);opacity:.55}
.lot.late::before,.lot.suspended::before,.lot.cpe::before{position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:5px;font-size:10px;font-weight:900;display:grid;place-items:center;color:#fff;z-index:1}
.lot.late::before{content:"$";background:var(--danger)}
.lot.suspended::before{content:"✕";background:#6b4b4b}
.lot.suspended svg,.lot.offline svg{filter:grayscale(.85);opacity:.6}
.lot.cpe::before{content:"▣";background:var(--gold)}
.lot.fib{box-shadow:inset 0 0 0 2px #f0a81a}
.lot.client.fiber::after{background:var(--gold)}
.lot.store{background:#d9d2f3}
.floor-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.role-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.role-row small{color:var(--muted);display:block}
.role-ctl{display:flex;gap:6px;align-items:center}
.role-ctl b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;background:#fff;min-width:0}
.tile b{font-size:14px}
.tile small{color:var(--muted);font-size:12px}
.tile.on{border-color:var(--signal);background:var(--signal-soft)}
.tile.warn{border-color:var(--gold);background:var(--gold-soft)}
.lot.cancelReq::before{content:"!";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:5px;font-size:11px;font-weight:900;display:grid;place-items:center;color:#fff;z-index:1;background:#8a3ffc;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.stat.coin b{color:#ffe08a}
.coin-ico{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#e5a21e 60%,#b87a0c);vertical-align:-1px;margin-right:4px}
.loan-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.loan-row small{color:var(--muted);display:block}
.big-num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.crisis{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.crisis.bad{background:var(--danger-soft);color:#7d1d1d}
.crisis.good{background:var(--signal-soft);color:#075a52}
.crisis b{display:block}
.annex{margin-top:14px;border:5px solid var(--facade-line);border-radius:10px 10px 4px 4px;background:repeating-linear-gradient(90deg,#e8dcc4 0 14px,#e1d3b8 14px 16px);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.annex.locked{background:repeating-linear-gradient(135deg,#e6e0d2 0 10px,#ddd5c3 10px 20px)}
.stock{display:flex;gap:4px;flex-wrap:wrap}
.stock i{width:14px;height:12px;border-radius:2px;background:#fff;border:1.5px solid var(--ink);opacity:.85}
.neg-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.neg-opt{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px}
.neg-opt:hover{border-color:var(--accent)}
.neg-opt:disabled{opacity:.45;cursor:not-allowed}
.neg-opt b{font-size:14px}
.neg-opt span{font-size:12.5px;color:var(--muted)}
.lot.sede{background:#f6d7bf}
.lot .ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--signal);opacity:0;animation:ping 2.4s ease-out infinite;pointer-events:none}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.blabel{align-self:start;justify-self:center;z-index:3;pointer-events:none;background:rgba(30,42,48,.82);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-top:-4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.bzone{z-index:2;border:3px solid transparent;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;padding:0;margin:-3px}
.bzone:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.7)}
.bzone.sel{background:rgba(240,102,26,.28);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mission{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 8px;border-radius:10px;align-items:start}
.mission.current{background:var(--gold-soft)}
.mission.done{opacity:.6}
.mission.locked{opacity:.5}
.mission .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:900;background:#fff}
.mission.done .tick{background:var(--signal);border-color:var(--signal);color:#fff}
.mission.current .tick{border-color:var(--gold)}
.mission b{display:block;font-size:14px}
.mission p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.mission .btn{margin-top:6px}
.mission .when{font-size:11px;font-weight:800;color:var(--signal);letter-spacing:.04em}
.toggle-done{margin-top:6px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:300px;overflow:auto}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.log time{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px;white-space:nowrap}
.rep-nav{display:flex;gap:4px;align-items:center}
.rep-nav button{border:0;background:#eef2ec;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:900}
.rep-nav button:disabled{opacity:.35;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.kpi{background:#f2f5ee;border-radius:10px;padding:7px 8px;min-width:0}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.finance{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;font-variant-numeric:tabular-nums;margin:0}
.finance dt{color:var(--muted)} .finance dd{margin:0;text-align:right;font-weight:700}
.events{margin:10px 0 0;padding-left:18px;font-size:13px}
.events li{margin-bottom:2px}
.products{display:flex;flex-direction:column;gap:8px}
.product{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px}
.product b{font-variant-numeric:tabular-nums}
.tabs{display:none}
.modal-wrap{position:fixed;inset:0;background:rgba(22,32,38,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:18px;width:min(700px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.mhead h2{font-size:21px;font-weight:800}
.x{border:0;background:#eef2ec;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.modal p{margin:0 0 10px}
.fam{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center;background:#f2f5ee;border-radius:12px;padding:10px;margin-bottom:12px}
.fam-art{background:var(--grass-cov);border-radius:10px;aspect-ratio:1;display:grid;place-items:center}
.fam-art svg{width:80%}
.fam dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:0}
.fam dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.fam dd{margin:0;font-weight:600;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt label{display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;height:100%}
.opt input:checked+label{border-color:var(--accent);background:#fff4ec}
.opt input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.opt input:disabled+label{opacity:.45;cursor:not-allowed}
.opt b{font-size:14px} .opt span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.notice{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.notice.bad{background:var(--danger-soft);color:#7d1d1d}
.notice.ok{background:var(--signal-soft);color:#075a52}
.notice.warn{background:var(--gold-soft);color:#6b4906}
.choice-list{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.choice div{min-width:0}
.choice b{display:block}
.choice small{color:var(--muted)}
.doc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.doc-row:last-child{border-bottom:0}
.doc-row p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-weight:700;font-size:13.5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px}
.input{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink);width:100%}
textarea.input{font-family:var(--mono);font-size:12px;min-height:180px;resize:vertical}
.bairro-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvl-table{width:100%;border-collapse:collapse;font-size:13.5px}
.lvl-table th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}

function log(msg){S.log.unshift({d:S.day,m:msg});S.log=S.log.slice(0,60);}
function event(msg){S.cur.eventos.push(msg);if(S.cur.eventos.length>20)S.cur.eventos.shift();}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}
function addXp(n){const b=levelOf(S.xp);S.xp+=n;const a=levelOf(S.xp);
  for(let L=b+1;L<=a;L++){const bonus=bonusFor(L);S.money+=bonus;S.cur.bonus+=bonus;log(`Subiu para o nível ${L}! Bônus de ${brl0(bonus)} no caixa.`);event(`Nível ${L}: bônus de ${brl0(bonus)}`);
    const lv=LEVELS.find(x=>x.l===L);toast(`Nível ${L}! +${brl0(bonus)} de bônus.${lv&&lv.items[0]!=='Bônus de caixa'?' Liberado: '+lv.items.join(', ')+'.':''}`);}}
function spend(v){if(S.money<v){toast(`Falta caixa: precisa de ${brl0(v)}.`);return false;}S.money-=v;S.cur.inv+=v;return true;}

/* ===================== Simulação ===================== */
function tick(){
  if(S.phase!=='play')return;
  S.day++;
  for(const d of DOCS){const st=S.docs[d.id];if(st&&!st.done&&st.until<=S.day){st.done=true;addXp(15);log(`${d.name}: pronto.`);event(`${d.name} pronto`);toast(`${d.name} pronto!`);save(true);}}
  for(const c of S.cities)for(const l of c.lots){if(l.st==='refused'&&l.until<=S.day)l.st='none';if(l.st==='cancelReq'&&l.reqUntil<=S.day)cancelClient(c,l,REASONS[l.reason]||'pedido não atendido');}
  const v=capOf('comercial',1);
  if(v>0&&S.day%4===0){for(let i=0;i<v;i++)vendorAttempt();}
  if(S.day%30===0)monthEnd();
  S.peak=Math.max(S.peak,allClients());
  checkMissions();
  save(false);renderAll();
}
function monthEnd(){
  const m=monthOf(S.day);
  let rev=0,clients=0,radioCl=0,fiberCl=0,tv=0,fone=0,over=0,calNow=0,lateUnpaid=0;
  const tcc=team('callcenter'),n2=built('callcenter')?(tcc.n2||0):0,ccE=effOf('callcenter');
  const ccCap=built('callcenter')?((tcc.voz||0)*40+(tcc.texto||0)*50)*ccE:0;
  const ccOps=opsOf('callcenter');
  const prevCompl=S.complaints||0;
  for(const c of S.cities){
    const offT=new Set(c.towers.filter(t=>t.off).map(t=>t.id));
    const overT=new Set(c.towers.filter(t=>!t.off&&towerLoad(c,t)>cap()).map(t=>t.id));over+=overT.size;
    for(const l of c.lots){
      if(!isSub(l))continue;
      const fib=l.tech==='fiber';
      const offline=!fib&&offT.has(l.tid);
      if(pays(l)&&!offline){rev+=priceNow(l);clients++;if(fib)fiberCl++;else radioCl++;if(l.combo.includes('tv'))tv++;if(l.combo.includes('fone'))fone++;}
      else if(l.st==='late'&&!offline){clients++;if(fib)fiberCl++;else radioCl++;lateUnpaid+=l.price;}
      if(l.st==='cancelReq')continue;
      if(l.st==='late'||l.st==='suspended'){
        l.debt=(l.debt||0)+(l.st==='late'?l.price:0);
        const months=Math.round((S.day-l.lateSince)/30);
        if(l.st==='late'&&months>=2){l.st='suspended';log(`${l.fam.name} foi suspenso por falta de pagamento.`);}
        else if(l.st==='suspended'&&months>=4){S.cur.perdaDivida=(S.cur.perdaDivida||0)+(l.debt||0);cancelClient(c,l,'dívida não paga');}
        continue;
      }
      let p=0.012;if(!fib&&overT.has(l.tid))p+=0.07;if(S.rep<40)p+=0.03;if(!built('tecnico'))p+=0.01;if(built('noc'))p-=0.008;if(effect('chuva')&&!fib)p+=0.02;if(offline)p+=0.35;
      if(fib)p-=0.008;p-=Math.min(n2,4)*0.003*ccE;p+=prevCompl*0.004;
      if(Math.random()<p){requestCancel(c,l,reasonFor(c,l,offline,!fib&&overT.has(l.tid)));continue;}
      if(offline)continue;
      let q=0.025;if(effect('crise'))q+=0.05;if(l.fam.need==='budget')q+=0.02;if(l.price>l.fam.budget)q+=0.03;if(S.rep<40)q+=0.01;q-=Math.min(ccOps,4)*0.004;
      if(Math.random()<q){l.st='late';l.lateSince=S.day;l.debt=0;calNow++;}
    }
  }
  // parcelas de acordos
  let parc=0;
  S.parcelas=S.parcelas.filter(pc=>{parc+=pc.amount;pc.left--;return pc.left>0;});
  // setor de recuperação
  let capR=capOf('recuperacao',3);
  while(capR>0){
    const all=[];for(const c of S.cities)for(const l of c.lots)if((l.st==='late'||l.st==='suspended')&&l.debt>0&&!l.recTried)all.push([c,l]);
    if(!all.length)break;capR--;
    const [c,l]=all[Math.floor(Math.random()*all.length)];l.recTried=true;
    const pr=clamp(0.5+(S.rep-50)/250-(effect('crise')?0.1:0),0.15,0.85);
    if(Math.random()<pr){const got=Math.round(l.debt*0.85);parc+=got;S.cur.recuperado+=got;l.st='client';delete l.debt;delete l.lateSince;S.recovered++;addXp(15);log(`Recuperação negociou com ${l.fam.name}: ${brl0(got)} e assinante reativado.`);}
  }
  for(const c of S.cities)for(const l of c.lots)delete l.recTried;
  // logística
  let capL=capOf('logistica',6);
  for(const c of S.cities)for(const l of c.lots){
    if(!l.cpe)continue;
    if(capL>0){capL--;if(Math.random()<0.88){l.cpe=false;S.stock++;S.cur.recolhidos++;}continue;}
    if(S.day-l.cpeSince>=90){l.cpe=false;S.cur.perdidos++;log(`Rádio da casa de ${l.fam.name} foi dado como perdido.`);}
  }
  // lojas: atendimento de balcão
  for(const c of S.cities)if(c.store){for(let i=0;i<2;i++)attemptSale(c,'loja');}
  // servidores de cache e reclamações
  let red=0,servers=0,compl=0;
  for(const sv of SERVERS){
    if(S.servers[sv.id]){servers++;if(built('noc'))red+=sv.share*0.8;continue;}
    const users=sv.id==='game'?S.cities.reduce((s,c)=>s+c.lots.filter(l=>isSub(l)&&l.fam.need==='game').length,0):Math.round(clients*sv.use);
    if(users>=sv.min&&Math.random()<0.4){compl++;log(`Clientes reclamam de travamento e latência no ${sv.name}. Um servidor de cache no NOC resolve.`);}
  }
  S.complaints=compl;S.cur.complaints+=compl;
  // marketing: encerra campanhas
  for(const c of S.cities)c.campaigns=(c.campaigns||[]).filter(x=>x.until>m);
  const staffCost=staffPayroll();
  const towersOn=S.cities.reduce((s,c)=>s+c.towers.filter(t=>!t.off).length,0);
  const link=Math.round((radioCl*12+fiberCl*15)*(1-red)), maint=towersOn*120*(effect('chuva')?2:1), content=tv*COMBOS.tv.unit+fone*COMBOS.fone.unit;
  const fiberMaint=S.cities.reduce((s,c)=>s+(c.fiber&&c.fiber.on?1000+c.fiber.ctos.length*40:0),0);
  const serverCost=servers*150, storeCost=S.cities.filter(c=>c.store).length*1500;
  let loanPay=0;
  S.loans=S.loans.filter(ln=>{const interest=ln.bal*ln.rate;const pay=Math.min(ln.pmt,ln.bal+interest);ln.bal=Math.max(0,ln.bal+interest-pay);ln.left--;loanPay+=pay;return ln.left>0&&ln.bal>0.5;});
  let coinsNow=0;
  for(const c of S.cities)for(const l of c.lots)if(l.st==='client'&&l.since){const mo=Math.floor((S.day-l.since)/30);if(mo>=12)coinsNow+=3;else if(mo>=6)coinsNow+=2;else if(mo>=3)coinsNow+=1;}
  S.coins+=coinsNow;S.cur.coins+=coinsNow;
  S.retCap=capOf('retencao',5);
  const exp=staffCost+link+maint+content+fiberMaint+serverCost+storeCost+Math.round(loanPay);
  S.money+=rev+parc-exp;
  // reputação
  let dRep=0;
  if(clients>0){if(ccCap<=0)dRep-=clients>8?5:1;else if(clients<=ccCap)dRep+=2;else dRep-=3;}
  dRep-=over*3+compl*2;
  const offWithClients=S.cities.reduce((s,c)=>s+c.towers.filter(t=>t.off&&c.lots.some(l=>isSub(l)&&l.tid===t.id)).length,0);
  dRep-=offWithClients*2;
  for(const c of S.cities){if(c.store)dRep+=1;}
  S.rep=clamp(S.rep+dRep,0,100);
  // rotatividade (RH)
  let quits=0;const where=[];
  const qBase=Math.max(0.008,0.04-opsOf('rh')*0.008)+(S.money<0?0.05:0)+(effect('crise')?0.01:0);
  for(const f of FLOORS){
    if(!built(f.id)||f.id==='recepcao'||f.id==='rh')continue;const t=team(f.id);let q=0;
    for(const k in t){let n=t[k]||0;for(let i=0;i<n;i++)if(Math.random()<qBase){t[k]--;q++;}}
    if(q){quits+=q;where.push(`${q} no ${f.name}`);}
  }
  if(quits){S.cur.quits+=quits;log(`${quits} funcionário(s) pediram demissão (${where.join(', ')}).${built('rh')?'':' Um RH segura a equipe.'}`);}
  S.cur.calotes+=calNow;
  const saldo=rev+parc-exp;
  S.history.push({m,rev,parc,loanPay:Math.round(loanPay),staff:staffCost,link,maint,content,fiberMaint,serverCost,storeCost,exp,saldo,lateUnpaid,inad:lateCount(),stock:S.stock,clientes:allClients(),fibra:fiberCl,rep:Math.round(S.rep),caixa:S.money,...S.cur});
  S.history=S.history.slice(-24);
  S.cur=newMonth();repView=null;
  if(saldo>0)addXp(10);
  log(`Fechamento do mês ${m}: saldo ${brl0(saldo)}${calNow?`, ${calNow} novo(s) inadimplente(s)`:''}.`);
  let news='';
  if(!S.crisis||m>=S.crisis.until){
    if(S.crisis&&m>=S.crisis.until){log(`Fim do evento: ${CRISES.find(x=>x.id===S.crisis.id).name}.`);S.crisis=null;}
    if(m>=2&&Math.random()<0.2){const ev=CRISES[Math.floor(Math.random()*CRISES.length)];S.crisis={id:ev.id,until:m+ev.months};event(`Começou: ${ev.name}`);log(`Evento: ${ev.name}. ${ev.desc}`);news=` ${ev.name}!`;}
  }
  toast(S.money<0?'Caixa negativo! Venda mais, negocie dívidas, desligue torres ou peça empréstimo.':`Mês ${m} fechado: saldo ${brl0(saldo)}.${news}`);
  save(true);
}
function signupBlock(c){
  if(!S.sede)return 'sede';
  if(!c.outorgaPaid)return 'outorga';
  if(!docsDone())return 'docs';
  return null;
}
function chance(c,lot,planId,combo){
  const pl=planById(planId),f=lot.fam,cov=coverOf(c,lot),fib=isFiberPlan(planId);
  const price=pl.price+combo.reduce((s,k)=>s+COMBOS[k].price,0);
  let p=0.4+(S.rep-50)/200;
  if(fib)p+=0.27;else if(cov&&cov.strong)p+=0.12;
  if(f.need==='work'||f.need==='game'){if(pl.mb>=35)p+=0.25;else if(pl.mb===10)p-=0.2;}
  if(f.need==='tv'){if(combo.includes('tv'))p+=0.3;else p-=0.1;}
  if(f.need==='basic'&&pl.mb===10)p+=0.1;
  if(f.need==='budget'&&price<=f.budget)p+=0.15;
  if(combo.length)p+=0.04;
  const bud=fib?f.budget*1.25:f.budget;
  if(price>bud+25)p-=0.6;else if(price>bud)p-=0.3;
  if(!fib&&cov&&towerLoad(c,cov.t)>=cap())p-=0.15;
  if(effect('crise'))p-=0.1;if(effect('boom'))p+=0.1;
  p+=cityBoost(c);
  return {p:clamp(p,0.03,0.92),price};
}
function plansAt(c,lot){return [...(coverOf(c,lot)?PLANS:[]),...(fiberAt(c,lot)?fiberPlans():[])];}
function bestOffer(c,lot){
  const sets=[[]];if(S.combos.tv)sets.push(['tv']);if(S.combos.fone)sets.push(['fone']);if(S.combos.tv&&S.combos.fone)sets.push(['tv','fone']);
  let best=null;
  for(const pl of plansAt(c,lot))for(const cb of sets){const r=chance(c,lot,pl.id,cb);const score=r.p*r.price;if(!best||score>best.score)best={plan:pl.id,combo:cb,price:r.price,p:r.p,score};}
  return best;
}
function nextIp(c){for(let i=10;i<255;i++)if(!c.used.includes(i))return i;return null;}
function activate(c,lot,deal,ip){
  lot.since=S.day;
  lot.tech=isFiberPlan(deal.plan)?'fiber':'radio';
  lot.st='client';lot.plan=deal.plan;lot.combo=deal.combo;lot.price=deal.price;lot.tid=deal.tid;lot.ip=ip;delete lot.deal;
  if(!c.used.includes(ip))c.used.push(ip);
  S.signed++;S.cur.novos++;addXp(20);S.peak=Math.max(S.peak,allClients());
}
function attemptSale(c,who){
  if(signupBlock(c))return false;
  const cands=c.lots.filter(l=>l.t==='house'&&l.st==='none'&&!l.cpe&&(coverOf(c,l)||fiberAt(c,l)));
  if(!cands.length)return false;
  const lot=cands[Math.floor(Math.random()*cands.length)];
  const o=bestOffer(c,lot);if(!o)return false;
  if(Math.random()<o.p){
    const fib=isFiberPlan(o.plan);
    const cost=(fib?ONU_COST:cpeFor())+(opsOf('tecnico')>0?0:THIRD_COST);
    if(S.money<cost)return false;
    if(fib)spend(ONU_COST);else takeCpe();
    if(!opsOf('tecnico'))spend(THIRD_COST);
    activate(c,lot,{plan:o.plan,combo:o.combo,price:o.price,tid:fib?null:coverOf(c,lot).t.id},nextIp(c));
    log(`${who==='loja'?'Loja':who==='carreata'?'Carreata':'Vendedor'} fechou com ${lot.fam.name} (${c.name}): ${planLabel(o.plan,o.combo)}.`);save(true);
    return true;
  }
  lot.st='refused';lot.until=S.day+45;return false;
}
function vendorAttempt(){for(const c of S.cities){if(signupBlock(c))continue;if(c.lots.some(l=>l.t==='house'&&l.st==='none'&&!l.cpe&&(coverOf(c,l)||fiberAt(c,l)))){attemptSale(c,'vendedor');return;}}}
function planLabel(planId,combo){const pl=planById(planId);return pl.name+(combo.length?' + '+combo.map(k=>COMBOS[k].short).join(' + '):'');}

function renderAll(){if(!S)return;renderTop();renderMap();renderReal();renderBuilding();renderProducts();renderMissions();renderReport();renderLog();}
function renderSaveDot(){const d=$('#saveDot');if(d)d.className='save-dot '+(cloud.status==='cloud'?'cloud':cloud.status==='erro'?'err':'');}
function renderTop(){
  const c=city();
  $('#companyName').textContent=`${S.company} · ${c.name}${c.uf?'/'+c.uf:''}`;

    <div class="stat"><span>Clientes</span><b>${allClients()}</b></div>

    <button class="icon-btn" data-act="bank" aria-label="Banco">Banco${S.loans.length?` · ${S.loans.length}`:''}</button>
    <button class="icon-btn" data-act="menu" aria-label="Menu e salvamento"><span class="save-dot" id="saveDot"></span>Menu</button>`;

}
function renderMap(){

  const sel=S.cities.length>1?`<select class="input" id="citySel" style="width:auto;padding:5px 8px" aria-label="Trocar cidade">${S.cities.map((cc,i)=>`<option value="${i}" ${i===S.ci?'selected':''}>${esc(cc.name)}</option>`).join('')}</select>`:'';
  $('#mapHead').innerHTML=`<div><p class="eyebrow">${c.pop.toLocaleString('pt-BR')} habitantes · rede 10.${c.idx+1}.0.0/24</p><h2>${esc(c.name)}${c.uf?` <small style="font-size:14px">${esc(c.uf)}</small>`:''}</h2></div>
   <div class="map-meta"><div class="view-toggle" role="group" aria-label="Visão do mapa"><button data-view="grid" aria-pressed="${mapView==='grid'}">Quadras</button><button data-view="real" aria-pressed="${mapView==='real'}">Mapa real</button></div>${sel}<span class="chip">Cobertura ${houses.length?Math.round(covered/houses.length*100):0}%</span><span class="chip">Clientes ${cl}/${houses.length}</span>${c.fiber&&c.fiber.on?`<span class="chip warn">Fibra · ${c.fiber.ctos.length} CTO</span>`:''}${cityBoost(c)>0?`<span class="chip ok">Marketing +${Math.round(cityBoost(c)*100)}%</span>`:''}<span class="chip">Torres ${c.towers.filter(t=>!t.off).length}${c.towers.some(t=>t.off)?` (+${c.towers.filter(t=>t.off).length} desligada)`:''}</span>${lateCount()?`<span class="chip bad">Inadimplentes ${lateCount()}</span>`:''}${og}${sedeMode?'':'<button class="btn small ghost" data-act="bairros">Bairros</button>'}</div>`;
  const cr=S.crisis&&monthOf(S.day)<=S.crisis.until?CRISES.find(x=>x.id===S.crisis.id):null;
  $('#crisisBar').innerHTML=cr?`<div class="crisis ${cr.bad?'bad':'good'}"><div><b>${cr.name} · até o fim do mês ${S.crisis.until}</b>${cr.desc}${cr.bad?' Dá para desligar torres com poucos clientes para cortar custos.':''}</div></div>`:'';
  $('#sedeBar').innerHTML=sedeMode&&mapView==='real'&&c.geo?`<div class="sede-bar"><p><b>Onde fica a sede?</b> ${sedePick?`Local escolhido: <b>${esc(sedePick.name||'buscando o bairro…')}</b>${sedePick.road?` · ${esc(sedePick.road)}`:''}`:'Toque no mapa no ponto exato do prédio.'}</p>
     <div class="sede-actions"><button class="btn small primary" data-act="declareSede" ${sedePick?'':'disabled'}>Declarar sede aqui</button></div></div>`:sedeMode?`<div class="sede-bar"><p><b>Onde fica a sede?</b> Toque num bairro do mapa. Selecionado: <b>${esc(c.bairros[selBairro])}</b></p>
     <div class="sede-actions"><button class="btn small ghost" data-act="bairros">Nomes dos bairros</button><button class="btn small primary" data-act="declareSede">Declarar sede aqui</button></div></div>`:'';
  const overT=new Set(c.towers.filter(t=>towerLoad(c,t)>cap()).map(t=>t.id));
  const lots=c.lots.map((l,i)=>{
    const col=l.x+Math.floor(l.x/3)+1,row=l.y+Math.floor(l.y/3)+1;
    let cls='lot',inner,label;
    const t=towerAt(c,l);
    if(l.t==='sede'){cls+=' sede';inner=sedeSvg(!!t)+(t&&!t.off?'<span class="ring"></span>':'');label=`Sede da ${S.company}`;}
    else if(l.t==='tower'){cls+=' tower'+(t&&t.off?' off':'');inner=towerSvg+(t&&t.off?'':'<span class="ring"></span>');label=`Torre ${t?t.ssid:''}`;}
    else if(l.t==='store'){cls+=' store';inner=storeSvg;label='Loja filial';}
    else if(l.t==='empty'){inner=l.tree?treeSvg:lotSvg;label='Terreno vazio';}
    else{const cov=coverOf(c,l);if(cov)cls+=' cov';cls+=' '+l.st;if(l.st==='client'&&overT.has(l.tid))cls+=' overload';if(l.cpe)cls+=' cpe';if(l.tech==='fiber')cls+=' fiber';const tt=l.tid&&c.towers.find(x=>x.id===l.tid);if(isSub(l)&&tt&&tt.off)cls+=' offline';inner=houseSvg(l);label=`Casa de ${l.fam.name}`;}
    if(!sedeMode&&fiberAt(c,l))cls+=' fib';
    const tag=sedeMode?'div':'button';
    return `<${tag} class="${cls}" style="grid-column:${col};grid-row:${row}" ${sedeMode?'':`data-lot="${i}"`} aria-label="${esc(label)}">${inner}</${tag}>`;
  }).join('');
  const labels=c.bairros.map((b,i)=>{const bx=i%3,by=Math.floor(i/3);const col=bx*4+1,row=by*4+1;
    return (sedeMode?`<button class="bzone ${i===selBairro?'sel':''}" style="grid-column:${col} / span 3;grid-row:${row} / span 3" data-bairro="${i}" aria-label="Bairro ${esc(b)}"></button>`:'')+`<span class="blabel" style="grid-column:${col} / span 3;grid-row:${row}">${esc(b)}</span>`;}).join('');
  $('#map').innerHTML=lots+labels;
}
function floorLabel(f){const list=FLOORS.filter(x=>!x.annex);const i=list.indexOf(f);return i===0?'Térreo':`${i}º andar`;}
function windowsHtml(n){const k=Math.max(6,Math.min(10,n));return `<div class="windows">${Array.from({length:k},(_,i)=>`<span class="win ${i<n?'':'empty'}">${i<n?'<span class="person"></span>':''}</span>`).join('')}${n>10?`<small>+${n-10}</small>`:''}</div>`;}
function builtFloorHtml(f,cls){
  const hc=headcount(f.id),e=effOf(f.id),iss=effIssues(f.id);
  const extra=f.id==='noc'?`<button class="btn small" data-act="servers">Servidores · ${Object.keys(S.servers).length}/${SERVERS.length}</button>`:f.id==='marketing'?`<button class="btn small" data-act="marketing">Campanhas</button>`:f.id==='rh'?`<span class="chip">Vagas por setor: ${sectorCap()}</span>`:'';
  return `<div class="${cls}"><div class="floor-top"><span class="floor-name"><small>${f.annex?'Galpão anexo':floorLabel(f)}</small>${f.name}</span><span class="floor-lvl">${hc} pessoa(s)<br>${brl0(rolesSum(f))}/mês</span></div>
    ${windowsHtml(hc)}
    <div class="floor-meta"><span class="chip ${hc===0?'bad':e<0.9?'warn':'ok'}">${hc===0?'Sem equipe':'Eficiência '+Math.round(e*100)+'%'}</span>${iss.length?`<span>${iss.join(' · ')}</span>`:''}</div>
    ${f.annex?`<p class="floor-desc"><b>Estoque: ${S.stock} rádio(s)</b>${S.cities.reduce((s,c)=>s+c.lots.filter(l=>l.cpe).length,0)?` · ${S.cities.reduce((s,c)=>s+c.lots.filter(l=>l.cpe).length,0)} para recolher`:''}${S.kits?` · ${S.kits} torre(s) desmontada(s)`:''}</p>`:''}
    <div class="floor-actions"><button class="btn small signal" data-act="team" data-f="${f.id}">Equipe</button>${extra}</div></div>`;
}
function rolesSum(f){const R=rolesOf(f),t=team(f.id);let s=0;for(const k in t)s+=(t[k]||0)*((R[k]||{}).sal||0);return s;}
function lockedFloorHtml(f,cls,why){return `<div class="${cls} locked"><div class="floor-top"><span class="floor-name"><small>${f.annex?'Galpão anexo':floorLabel(f)}</small>${f.name}</span><span class="floor-lvl">🔒 ${why}</span></div><p class="floor-desc">${f.desc}</p></div>`;}
function buyFloorHtml(f,cls){return `<div class="${cls}"><div class="floor-top"><span class="floor-name"><small>${f.annex?'Galpão anexo':floorLabel(f)}</small>${f.name}</span><span class="floor-lvl">Liberado</span></div><p class="floor-desc">${f.desc}</p><div class="floor-actions"><button class="btn primary small" data-act="build" data-f="${f.id}">Comprar ${f.annex?'galpão':'andar'} · ${brl0(f.cost)}</button></div></div>`;}
function floorHtml(f,lvl){
  const cls=f.annex?'annex':'floor';
  if(built(f.id))return builtFloorHtml(f,cls);
  if(!companyLicensed())return lockedFloorHtml(f,cls,'Requer outorga');
  if(lvl<f.level)return lockedFloorHtml(f,cls,'Nível '+f.level);
  return buyFloorHtml(f,cls);
}
function renderBuilding(){
  const lvl=levelOf(S.xp);
  if(!S.sede){$('#building').innerHTML=`<div class="empty-building">${sedeSvg(false)}<b>Sem sede ainda</b><p class="floor-desc">Escolha o bairro da sede no mapa. O térreo com a recepção é grátis.</p><button class="btn small primary" data-act="focusMap" style="margin-top:8px">Ir para o mapa</button></div>`;return;}
  const c0=S.cities[0];
  let h=`<div class="roof"><svg viewBox="0 0 120 74" aria-hidden="true"><path d="M60 4 L50 70 M60 4 L70 70 M53 50 L67 50 M55 32 L65 32 M57 16 L63 16 M53 50 L65 32 M55 32 L63 16" stroke="var(--accent)" stroke-width="2.4" fill="none"/><rect x="63" y="10" width="6" height="14" rx="2" fill="#fff" stroke="#1e2a30"/><rect x="51" y="10" width="6" height="14" rx="2" fill="#fff" stroke="#1e2a30"/><circle cx="60" cy="4" r="3.4" fill="var(--danger)"/></svg></div>`;
  h+=`<div class="sign">${esc(S.company)}</div>`;
  const fibCities=S.cities.filter(c=>c.fiber&&c.fiber.on).length,fibCl=S.cities.reduce((s,c)=>s+c.lots.filter(l=>isSub(l)&&l.tech==='fiber').length,0);
  h+=lvl<FIBRA_LEVEL?`<div class="floor soon"><div class="floor-top"><span class="floor-name">Fibra óptica</span><span class="floor-lvl">🔒 Nível ${FIBRA_LEVEL}</span></div><p class="floor-desc">Backbone de ${brl0(BACKBONE_COST)} por cidade, caixas CTO por bairro e clientes migrando do rádio.</p></div>`
    :`<div class="floor"><div class="floor-top"><span class="floor-name"><small>Diretoria de rede</small>Fibra óptica</span><span class="floor-lvl">${FIBER_TIERS[S.fiberTier].name}</span></div><p class="floor-desc">Backbone em ${fibCities} cidade(s) · ${fibCl} cliente(s) na fibra.</p><div class="floor-actions"><button class="btn small primary" data-act="fiber">Rede de fibra</button></div></div>`;
  for(const f of [...FLOORS].filter(f=>!f.annex).reverse()){
    if(f.id==='recepcao'){
      const actions=!c0.outorgaPaid?`<button class="btn small primary" data-act="outorga">Comprar outorga · ${brl0(c0.outorga)}</button>`:`<button class="btn small ${docsDone()?'ghost':'primary'}" data-act="docs">Documentação</button>`;
      h+=`<div class="floor ground"><div class="floor-top"><span class="floor-name"><small>Térreo</small>${f.name}</span><span class="floor-lvl">Sede · ${esc(c0.bairros[S.sede.b])}</span></div><p class="floor-desc">${f.desc}${S.partners?` Sócios: ${S.partners}.`:''}</p><div class="floor-actions">${actions}</div></div>`;
      continue;
    }
    h+=floorHtml(f,lvl);
  }
  h+=`<div class="door"></div>`+floorHtml(FLOORS.find(x=>x.annex),lvl);
  $('#building').innerHTML=h;
}
function renderProducts(){
  const lvl=levelOf(S.xp);
  let h=PLANS.map(p=>`<div class="product"><span>${p.name}</span><b>${brl(p.price)}</b></div>`).join('');
  if(lvl>=FIBRA_LEVEL)h+=fiberPlans().map(p=>`<div class="product"><span>${p.name}</span><b>${brl(p.price)}</b></div>`).join('');
  for(const [k,cb] of Object.entries(COMBOS)){
    if(S.combos[k])h+=`<div class="product"><span>+ ${cb.name}</span><b>${brl(cb.price)}</b></div>`;
    else if(lvl>=cb.level&&companyLicensed())h+=`<div class="product"><span>+ ${cb.name}<br><small class="muted">Contrato com ${cb.who}</small></span><button class="btn small primary" data-act="combo-${k}">${brl0(cb.cost)}</button></div>`;
    else h+=`<div class="product muted"><span>+ ${cb.name}</span><span class="chip">🔒 Nível ${cb.level}</span></div>`;
  }
  $('#products').innerHTML=h;
}
function renderMissions(){
  const lvl=levelOf(S.xp),ms=missionList();
  const cur=ms.findIndex(m=>!m.done&&!(m.need&&lvl<m.need));
  const doneCount=ms.filter(m=>m.done).length;
  const rows=ms.map((m,i)=>{
    if(m.done&&!showDone)return '';
    const locked=m.need&&lvl<m.need;
    const st=m.done?'done':locked?'locked':i===cur?'current':'';
    const showBtn=!m.done&&!locked&&m.act&&i===cur;
    const when=m.done&&S.mdone[m.id]?`<span class="when">Concluída no mês ${S.mdone[m.id]}</span>`:'';
    return `<li class="mission ${st}"><span class="tick">${m.done?'✓':locked?'🔒':''}</span><div><b>${esc(m.t)}</b><p>${esc(m.d)}</p>${when}${showBtn?`<button class="btn small primary" data-act="${m.act}">${m.btn}</button>`:''}</div></li>`;
  }).join('');
  $('#missions').innerHTML=rows+(doneCount?`<li><button class="btn small ghost toggle-done" data-act="toggleDone">${showDone?'Esconder':'Mostrar'} concluídas (${doneCount})</button></li>`:'');
}
function evBlock(r){
  const ms=r.missoes||[],ev=(r.eventos||[]).slice(-8);
  return (ms.length?`<p class="eyebrow" style="margin-top:12px">Missões concluídas (${ms.length})</p><ul class="events">${ms.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:'')+(ev.length?`<p class="eyebrow" style="margin-top:12px">O que aconteceu</p><ul class="events">${ev.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:'');
}

function openBairros(){

    <div id="aiBox"></div>
    <div class="bairro-grid">${c.bairros.map((b,i)=>`<div class="field"><label for="bn${i}">${DIRS[i]}</label><input class="input" id="bn${i}" maxlength="26" value="${esc(b)}"></div>`).join('')}</div>
    <div class="foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="bnSave">Salvar nomes</button></div>`,async m=>{
    m.querySelector('#bnSave').onclick=()=>{for(let i=0;i<9;i++){const v=m.querySelector('#bn'+i).value.trim();if(v&&v!==c.bairros[i]){c.bairros[i]=v;c.namesAuto=false;if(c.geo&&c.geo.bairros[i])c.geo.bairros[i].name=v;}}save(true);closeModal();toast('Bairros atualizados.');};

    box.innerHTML=`<div class="notice ok" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>Quer que o Claude sugira bairros reais de ${esc(c.name)}?</span><button class="btn small signal" id="aiGo">Sugerir bairros</button></div>`;
    m.querySelector('#aiGo').onclick=async()=>{
      const b=m.querySelector('#aiGo');b.disabled=true;b.textContent='Buscando…';
      try{
        const out=await sample.json(`Liste 9 bairros reais da cidade de ${c.name}${c.uf?' ('+c.uf+')':''}, Brasil, para um jogo. O primeiro deve ser o bairro central (Centro ou equivalente). Responda apenas JSON no formato {"conhece":true,"bairros":["nome1","nome2","nome3","nome4","nome5","nome6","nome7","nome8","nome9"]}. Se não conhecer a cidade, use "conhece":false e nomes comuns de bairros brasileiros.`,{modelTier:'quick'});
        const list=(out&&Array.isArray(out.bairros)?out.bairros:[]).map(s=>String(s).slice(0,26)).filter(Boolean);
        if(list.length<9)throw new Error('poucos');
        const order=[list[1],list[2],list[3],list[4],list[0],list[5],list[6],list[7],list[8]];
        order.forEach((v,i)=>{const inp=m.querySelector('#bn'+i);if(inp)inp.value=v;});
        box.innerHTML=`<div class="notice ${out.conhece?'ok':'warn'}">${out.conhece?'Sugestões preenchidas. Confira antes de salvar: a IA pode errar algum nome.':'O Claude não conhece bem essa cidade e sugeriu nomes comuns. Edite à vontade.'}</div>`;
      }catch(e){b.disabled=false;b.textContent='Tentar de novo';toast(e&&e.code==='not_granted'?'Sugestão não permitida.':'Não deu para buscar agora.');}
    };

}
function declareSede(){
  const c=S.cities[0];
  let lot,pick=null;
  if(mapView==='real'&&sedePick&&c.geo){
    pick=sedePick;const gp=geoToGrid(c.geo,pick.lat,pick.lon);
    const gx=clamp(gp.x,0.01,8.99),gy=clamp(gp.y,0.01,8.99);selBairro=Math.floor(gy/3)*3+Math.floor(gx/3);
    if(pick.name&&(c.namesAuto!==false||!(c.geo.bairros[selBairro]||{}).real)){c.bairros[selBairro]=pick.name;if(c.geo.bairros[selBairro])c.geo.bairros[selBairro].name=pick.name;}
    const inB=c.lots.filter(l=>bairroOf(l)===selBairro).sort((a,b)=>Math.hypot(a.x+.5-gx,a.y+.5-gy)-Math.hypot(b.x+.5-gx,b.y+.5-gy));
    lot=inB.find(l=>l.t==='empty')||inB[0];
  }else{
    const inB=c.lots.filter(l=>bairroOf(l)===selBairro);
    lot=inB.find(l=>l.t==='empty'&&!l.tree)||inB.find(l=>l.t==='empty')||inB[4];
  }
  lot.t='sede';delete lot.fam;delete lot.st;
  S.sede={ci:0,b:selBairro,x:lot.x,y:lot.y};if(pick){S.sede.lat=pick.lat;S.sede.lon=pick.lon;S.sede.addr=pick.road||'';}sedePick=null;
  S.phase='play';
  log(`Sede declarada no bairro ${c.bairros[selBairro]}. Recepção aberta!`);event(`Sede aberta no bairro ${c.bairros[selBairro]}`);
  checkMissions();save(true);renderAll();
  openModal(head('Sede','Recepção aberta!')+`<p>O prédio da <b>${esc(S.company)}</b> fica no bairro <b>${esc(c.bairros[selBairro])}</b>. O térreo com a recepção é grátis; os outros quatro andares você compra conforme cresce.</p>
    <div class="notice warn">Próximo passo: comprar a <b>outorga de ${esc(c.name)}</b> (${brl0(c.outorga)}). Sem ela, todos os setores ficam bloqueados.</div>
    <div class="foot"><button class="btn" data-close>Depois</button><button class="btn primary" data-act="outorga">Comprar outorga</button></div>`);
}
function openDocs(){
  if(!companyLicensed()){openOutorga(0);return;}
  const rows=DOCS.map(d=>{
    const st=S.docs[d.id];let right;
    if(st&&st.done)right='<span class="chip ok">Pronto</span>';
    else if(st)right=`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span class="chip warn">Faltam ${Math.max(1,st.until-S.day)} dia(s)</span><button class="btn small" data-fast="${d.id}" ${S.coins<3?'disabled':''}><i class="coin-ico"></i>Concluir já · 3</button></div>`;
    else{const ok=!d.req||(S.docs[d.req]&&S.docs[d.req].done);right=`<button class="btn small ${ok?'primary':''}" data-doc="${d.id}" ${ok?'':'disabled'}>${d.cost?brl0(d.cost):'Grátis'} · ${d.days} dias</button>`;}
    return `<div class="doc-row"><div><b>${d.name}</b><p>${d.info}${d.req&&!(S.docs[d.req]&&S.docs[d.req].done)?' Depende do anterior.':''}</p></div>${right}</div>`;
  }).join('');
  openModal(head('Recepção','Documentação')+`<p class="muted">Cada documento leva alguns dias do jogo. Feche esta janela para o relógio correr.</p>${rows}`,m=>{
    m.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{
      const d=DOCS.find(x=>x.id===b.dataset.doc);if(!spend(d.cost))return;
      S.docs[d.id]={done:false,until:S.day+d.days};log(`${d.name}: em andamento.`);save(true);openDocs();
    });
    m.querySelectorAll('[data-fast]').forEach(b=>b.onclick=()=>{
      if(S.coins<3)return;const d=DOCS.find(x=>x.id===b.dataset.fast);S.coins-=3;S.docs[d.id].done=true;addXp(15);log(`${d.name}: concluído na hora com selos.`);event(`${d.name} pronto`);checkMissions();save(true);openDocs();
    });
  });
}

function blockNotice(c,why){
  if(why==='outorga')return `<div class="notice bad">Falta a outorga de ${esc(c.name)} (${brl0(c.outorga)}).<br><button class="btn small primary" data-act="outorga" style="margin-top:6px">Comprar outorga</button></div>`;

}

function openRetention(c,l){

  const left=Math.max(0,l.reqUntil-S.day);

function debtTotal(){return S.loans.reduce((s,l)=>s+l.bal,0);}
function pmt(P,r,n){return P*r/(1-Math.pow(1+r,-n));}

  });

    {id:'full',t:'Cobrar tudo',d:`Recebe ${brl0(debt)} à vista`,p:clamp(0.22+base,0.05,0.9),get:debt,parc:0},
    {id:'desc',t:'Desconto de 30%',d:`Recebe ${brl0(debt*0.7)} à vista`,p:clamp(0.5+base,0.05,0.9),get:debt*0.7,parc:0},
    {id:'parc',t:'Parcelar em 3x',d:`${brl0(debt/3)} agora + 2 parcelas`,p:clamp(0.68+base,0.05,0.92),get:debt/3,parc:debt/3},

    <p class="muted">Sem acordo, o cliente é suspenso no 2º mês e cancelado no 4º; aí o rádio em comodato precisa ser recolhido.${cc?` Seu Call Center (${cc} atendente${cc>1?'s':''}) aumenta a chance de acordo.`:' Um Call Center aumenta a chance de acordo.'}</p>
    ${wait?`<div class="notice warn">O cliente pediu um tempo. Tente de novo em ${l.negUntil-S.day} dia(s).</div>`:''}
    <div class="neg-opts">${opts.map(o=>`<button class="neg-opt" data-neg="${o.id}" ${wait?'disabled':''}><b>${o.t}</b><span>${o.d}</span><span class="chip ${o.p>=0.6?'ok':o.p>=0.35?'warn':'bad'}" style="align-self:flex-start">Chance ${o.p>=0.6?'alta':o.p>=0.35?'média':'baixa'}</span></button>`).join('')}</div>
    <div class="foot">${l.st==='late'?'<button class="btn small" id="dSusp">Suspender agora</button>':'<span></span>'}<button class="btn small ghost" id="dCancel">Cancelar contrato</button></div>`,m=>{

      const o=opts.find(x=>x.id===b.dataset.neg);

        if(o.parc)S.parcelas.push({amount:Math.round(o.parc),left:2,who:l.fam.name});
        l.st='client';delete l.debt;delete l.lateSince;delete l.negUntil;S.recovered++;addXp(15);
        log(`Acordo com ${l.fam.name}: ${o.t.toLowerCase()} (${brl0(got)} agora). Cliente reativado.`);event(`Acordo com ${l.fam.name}`);checkMissions();save(true);
        openModal(head('Cobrança','Acordo fechado!')+`<p><b>${esc(l.fam.name)}</b> aceitou: ${o.t.toLowerCase()}. Entraram ${brl0(got)} no caixa${o.parc?` e mais 2 parcelas de ${brl0(o.parc)} chegam nos próximos fechamentos`:''}. O cliente voltou a navegar.</p><div class="foot"><span></span><button class="btn primary" data-close>Ok</button></div>`);
      }else{

}

function onLot(i){
  const c=city(),lot=c.lots[i];
  const t=towerAt(c,lot);
  if(lot.t==='sede'){
    if(t){towerInfo(c,t);return;}
    openModal(head('Sede',esc(S.company))+`<p>Prédio da empresa no bairro <b>${esc(c.bairros[S.sede.b])}</b>.</p>
      <div class="choice-list"><div class="choice"><div><b>Ver o prédio</b><small>Andares, equipe e setores.</small></div><button class="btn small" data-act="goBuilding">Abrir</button></div>
      <div class="choice"><div><b>Torre no topo do prédio</b><small>Usa a altura da sede para cobrir o bairro.</small></div><button class="btn small primary" id="roofT">Instalar</button></div></div>`,m=>{m.querySelector('#roofT').onclick=()=>towerOffer(c,lot,true);});
    return;
  }
  if(lot.t==='empty'){openEmptyLot(c,lot);return;}
  if(lot.t==='store'){openStore(c);return;}
  if(lot.t==='tower'){towerInfo(c,t);return;}
  const f=lot.fam,cov=coverOf(c,lot)||(fiberAt(c,lot)?{fiber:true}:null);
  if(lot.st==='pending'){openInstall(c,lot,lot.deal,true);return;}
  if(lot.st==='late'||lot.st==='suspended'){openDebt(c,lot);return;}
  if(lot.cpe){openRecover(c,lot);return;}
  if(lot.st==='cancelReq'){openRetention(c,lot);return;}
  if(lot.st==='client'){
    openModal(head('Cliente',`Casa de ${esc(f.name)}`)+`<div class="fam"><div class="fam-art">${houseSvg(lot)}</div><dl><div><dt>Plano</dt><dd>${planLabel(lot.plan,lot.combo)}</dd></div><div><dt>Mensalidade</dt><dd>${brl(priceNow(lot))}${priceNow(lot)<lot.price?' (com desconto)':''}</dd></div><div><dt>Cliente há</dt><dd>${Math.floor((S.day-(lot.since||S.day))/30)} mês(es)</dd></div><div><dt>${lot.tech==='fiber'?'Tecnologia':'IP do rádio'}</dt><dd style="font-family:var(--mono)">${lot.tech==='fiber'?'Fibra (FTTH)':`10.${c.idx+1}.0.${lot.ip}`}</dd></div><div><dt>${lot.tech==='fiber'?'Bairro':'Torre'}</dt><dd>${lot.tech==='fiber'?esc(c.bairros[bairroOf(lot)]):esc((c.towers.find(t=>t.id===lot.tid)||{}).ssid||'—')}</dd></div></dl></div>${lot.tech!=='fiber'&&fiberAt(c,lot)?`<div class="foot"><span class="muted">Este bairro tem fibra.</span><button class="btn primary" id="toFiber">Oferecer migração para fibra</button></div>`:''}`,m=>{const b=m.querySelector('#toFiber');if(b)b.onclick=()=>openMigrate(c,lot);});return;
  }
  if(lot.st==='refused'){openModal(head('Porta a porta',`Casa de ${esc(f.name)}`)+`<p>Essa família não quer conversa agora. Volte daqui a ${Math.max(1,lot.until-S.day)} dia(s).</p>`);return;}
  if(!cov){openModal(head('Porta a porta',`Casa de ${esc(f.name)}`)+`<p>Ainda não tem sinal aqui. Instale uma torre num terreno vazio por perto${levelOf(S.xp)>=FIBRA_LEVEL?' ou leve a fibra até o bairro com uma caixa CTO':''}.</p>`);return;}
  openPap(c,lot);
}

    <div class="foot"><div>Total <b id="papTotal"></b> <span class="chip" id="papChance"></span></div><button class="btn primary" id="papGo" ${block?'disabled':''}>Oferecer plano</button></div>
    <p class="muted" style="font-size:12.5px;margin-top:8px">${fibHere?`Na fibra, a ONU custa ${brl0(ONU_COST)}. `:''}${S.stock?`O rádio sai do estoque (${S.stock} disponíveis), sem custo.`:`O rádio do cliente (CPE) fica em comodato e custa ${brl0(cpeCost())} para a empresa${effect('dolar')?' (dólar alto)':''}.`}</p>`,m=>{

    m.querySelectorAll('.opt input').forEach(x=>x.onchange=upd);upd();
    m.querySelector('#papGo').onclick=()=>{
      const o=read();const r=chance(c,lot,o.plan,o.combo);

        log(`${f.name} assinou ${planLabel(o.plan,o.combo)}.`);save(true);
        openInstall(c,lot,lot.deal,false);
      }else{

        let why='Disse que vai pensar e fechou a porta.';

function parseIp(s){const p=String(s).trim().split('.');if(p.length!==4)return null;const n=p.map(x=>/^\d{1,3}$/.test(x)?+x:NaN);if(n.some(v=>isNaN(v)||v>255))return null;return n;}
function checkAddr(c,v,errs){
  const net=`10.${c.idx+1}.0`;const ip=parseIp(v.ip);let octet=null;
  if(!ip)errs.push(['Endereço IP inválido','Um IP tem 4 números de 0 a 255 separados por ponto, como '+net+'.25.']);
  else if(ip.slice(0,3).join('.')!==net)errs.push(['IP fora da rede',`O rádio precisa estar na mesma rede do roteador: ${net}.X. Com outro começo, ele não conversa com o gateway.`]);
  else if(ip[3]===0||ip[3]===255)errs.push(['IP reservado','O .0 é o endereço da rede e o .255 é o broadcast. Use de .2 a .254.']);
  else if(c.used.includes(ip[3]))errs.push(['IP em uso',`O ${net}.${ip[3]} já é de outro equipamento. Dois aparelhos com o mesmo IP causam conflito e queda.`]);
  else octet=ip[3];
  if(v.mask.trim()!=='255.255.255.0')errs.push(['Máscara errada','A rede é /24: os 3 primeiros números são fixos. Isso equivale à máscara 255.255.255.0.']);
  if(v.gw.trim()!==`${net}.1`)errs.push(['Gateway errado',`O gateway é o roteador do provedor, a saída para a internet. Nesta cidade é ${net}.1.`]);
  return octet;
}
function sheetNet(c){
  const net=`10.${c.idx+1}.0`;
  const used=c.used.slice().sort((a,b)=>a-b);
  const shown=used.slice(0,10).map(o=>'.'+o).join(' ')+(used.length>10?` … (+${used.length-10})`:'');
  return `<div class="sheet"><h4>Ficha da rede</h4><dl><dt>Rede</dt><dd>${net}.0/24</dd><dt>Gateway</dt><dd>${net}.1</dd><dt>Em uso</dt><dd>${shown}</dd></dl></div>`;
}

}

const NOMI='https://nominatim.openstreetmap.org';

async function fetchJson(url,opts={},ms=25000){
  const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{...opts,signal:ac.signal,headers:{'Accept':'application/json',...(opts.headers||{})}});if(!r.ok)throw new Error('http '+r.status);return await r.json();}
  finally{clearTimeout(t);}
}
// Nominatim pede no máximo 1 consulta por segundo
let nomiChain=Promise.resolve();
function nomi(url){const run=nomiChain.then(()=>fetchJson(url)).finally(()=>new Promise(r=>setTimeout(r,1100)));nomiChain=run.catch(()=>{}).then(()=>new Promise(r=>setTimeout(r,0)));return run;}
const placeCache=new Map();
function getPosition(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej({code:0});navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),rej,{enableHighAccuracy:false,timeout:15000,maximumAge:600000});});}
function ufFrom(addr){const iso=(addr&&addr['ISO3166-2-lvl4'])||'';return iso.startsWith('BR-')?iso.slice(3):'';}
async function reverseCity(lat,lon){const r=await nomi(`${NOMI}/reverse?format=jsonv2&zoom=10&addressdetails=1&accept-language=pt-BR&lat=${lat}&lon=${lon}`);const a=r.address||{};return {name:a.city||a.town||a.village||a.municipality||'',uf:ufFrom(a)};}
async function reversePlace(lat,lon){
  const k=lat.toFixed(4)+','+lon.toFixed(4);if(placeCache.has(k))return placeCache.get(k);
  const r=await nomi(`${NOMI}/reverse?format=jsonv2&zoom=17&addressdetails=1&accept-language=pt-BR&lat=${lat}&lon=${lon}`);
  const a=r.address||{};const out={bairro:a.suburb||a.neighbourhood||a.quarter||a.residential||a.city_district||a.hamlet||'',road:a.road||a.pedestrian||''};
  placeCache.set(k,out);return out;
}
async function geocodeCity(name,uf){
  const q=encodeURIComponent(`${name}${uf?', '+uf:''}, Brasil`);
  const list=await nomi(`${NOMI}/search?format=jsonv2&countrycodes=br&limit=6&addressdetails=1&extratags=1&accept-language=pt-BR&q=${q}`);
  if(!list.length)return null;
  const good=list.find(r=>r.osm_type==='relation'&&(r.type==='administrative'||['municipality','city','town'].includes(r.addresstype)))||list.find(r=>['city','town','village','municipality'].includes(r.addresstype))||list[0];
  const a=good.address||{};
  return {lat:+good.lat,lon:+good.lon,osmType:good.osm_type,osmId:good.osm_id,pop:parseInt(((good.extratags||{}).population||'').replace(/\D/g,''))||0,name:a.city||a.town||a.village||a.municipality||good.name,uf:ufFrom(a)};
}
async function overpass(q){let last;for(const url of OVERPASS){try{return await fetchJson(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}},30000);}catch(e){last=e;}}throw last;}
async function fetchBairros(g){
  const filt='[place~"^(suburb|neighbourhood|quarter)$"][name];out body 300;';
  const q=g.osmType==='relation'?`[out:json][timeout:25];area(${3600000000+Number(g.osmId)})->.a;node(area.a)${filt}`:`[out:json][timeout:25];node(around:7000,${g.lat},${g.lon})${filt}`;
  const r=await overpass(q);const seen=new Set();
  return (r.elements||[]).filter(e=>e.tags&&e.tags.name).map(e=>({name:e.tags.name,lat:e.lat,lon:e.lon})).filter(b=>{const k=b.name.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
}
async function countBuildingsPoly(latlngs){

      <div class="field"><label for="dAz">Direção da antena · <b id="dAzV">${draft.az}° ${compass(draft.az)}</b></label><input type="range" id="dAz" min="0" max="359" step="1" value="${draft.az}"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small ghost" data-act="bestAz">Melhor direção</button><small class="muted" style="align-self:center">Ou arraste a bolinha laranja no mapa.</small></div></div>
      <div class="field"><label>Cobertura</label><div id="dCov">${covHtml(cov)}</div></div>
    </div>
    <div class="foot"><div><small class="muted">Terreno ${draft.m2} m² × ${brl0(draft.priceM2)} = ${brl0(draft.land)} · ${kit?`torre do galpão ${brl0(KIT_COST)}`:`torre e rádio ${brl0(EQUIP_COST)}`}</small><br><b>Total ${brl0(total)}</b></div><button class="btn primary" data-act="buyDraft" ${block?'disabled':''}>${block?(block==='outorga'?'Falta a outorga':block==='docs'?'Falta a documentação':'Declare a sede'):'Comprar terreno e configurar'}</button></div>
  </div>`;
  const r=$('#dAz');if(r)r.oninput=()=>{draft.az=+r.value;renderDraftPanel(c,true);drawDraftHandleOnly(c);};
  if(r)r.onchange=()=>{drawDraft(c);queueBuildingCount(c);};
}
function drawDraftHandleOnly(c){/* o leque é atualizado em renderDraftPanel(light); a bolinha se ajusta ao soltar */}
function covHtml(cov){return `<b>${cov.homes.toLocaleString('pt-BR')} domicílios</b> no leque (${cov.houses} casas do jogo), sendo <b>${cov.freshHomes.toLocaleString('pt-BR')}</b> ainda sem sinal.${cov.parts&&cov.parts.length?`<br><small class="muted">${cov.parts.slice(0,4).map(x=>`${esc(x[0])}: ${x[1].toLocaleString('pt-BR')}`).join(' · ')}</small>`:''}${draft&&draft.blds!=null?`<br><small class="muted">${draft.blds.toLocaleString('pt-BR')} construções mapeadas no OpenStreetMap dentro do leque.</small>`:''}`;}
function renderReal(){
  if(!S)return;
  const grid=mapView!=='real';
  $('#gridWrap').hidden=!grid;$('#gridLegend').hidden=!grid;$('#realWrap').hidden=grid;
  if(grid)return;
  const c=city(),tools=$('#realTools');
  if(!c.geo){
    const busy=geoBusy.has(c);
    $('#realMap').hidden=true;
    tools.innerHTML=`<div class="real-empty"><b>${busy?esc(c.geoStep||`Buscando ${c.name} no mapa…`):c.geoError==='offline'?'Sem internet agora':c.geoError==='notfound'?`Não encontrei ${esc(c.name)}${c.uf?'/'+esc(c.uf):''} no mapa`:'Mapa real ainda não carregado'}</b><p class="muted" style="margin:0;max-width:440px">${busy?'Os dados vêm do OpenStreetMap.':c.geoError==='notfound'?'Confira o nome da cidade e o estado.':'O mapa real precisa de internet. Enquanto isso, o jogo funciona nas quadras.'}</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${busy?'':`<button class="btn primary small" data-act="geoLoad">Carregar mapa real</button>`}<button class="btn small ghost" data-view="grid">Ver quadras</button></div></div>`;
    return;
  }
  $('#realMap').hidden=false;
  if(!window.L){tools.innerHTML='<div class="real-empty"><b>Carregando o mapa…</b></div>';setTimeout(renderReal,400);return;}
  initLeaflet();LM.invalidateSize(false);
  if(LM.getSize().x===0){LSig='';return;}
  const sig=JSON.stringify([c.idx,c.geo.loadedAt,c.towers.map(t=>[t.id,t.off,towerLoad(c,t)]),c.fiber.ctos,c.store,S.sede,c.bairros,c.lots.map(l=>l.st||l.t).join(''),S.phase]);
  if(sig!==LSig){const first=!LSig||!LSig.startsWith('['+c.idx+','+c.geo.loadedAt);LSig=sig;drawReal(c,first);}
  if(!$('#draftPanel')||tools.dataset.phase!==S.phase){
    tools.dataset.phase=S.phase;
    tools.innerHTML=`<div class="real-tools"><div class="grp">${S.phase==='sede'?'':`<button class="btn small primary" data-act="newTower">+ Nova torre</button>`}<button class="btn small ghost" data-act="gpsMe">📍 Onde estou</button></div><div class="grp"><button class="btn small ghost" data-act="geoLoad">Atualizar mapa</button></div></div><div id="draftPanel"></div><p class="geo-note" id="geoNote"></p>`;
  }
  const nb=tools.querySelector('[data-act="newTower"]');if(nb)nb.hidden=!!draft;
  const srcTxt={ibge:`Bairros e domicílios oficiais do IBGE, Censo 2022 (${(c.geo.homes||0).toLocaleString('pt-BR')} domicílios).`,cep:`Bairros identificados cruzando as ruas com os CEPs dos Correios (ViaCEP). Domicílios estimados pela população (≈ ${c.geo.homes.toLocaleString('pt-BR')}).`,osm:`Bairros do OpenStreetMap. Domicílios estimados pela população (≈ ${c.geo.homes.toLocaleString('pt-BR')}).`}[c.geo.source||'osm'];
  $('#geoNote').textContent=(S.phase==='sede'?'Toque no mapa para escolher o ponto exato da sede. ':'Toque em qualquer ponto para ver o bairro e o preço do m². ')+srcTxt;
  if(draft&&!$('#draftPanel').innerHTML)renderDraftPanel(c);
}
function drawReal(c,fit){
  LLayers.clearLayers();
  const lm=c.geo.side/9;
  // bairros oficiais (IBGE): contorno real
  const ibd=c.geo.ibgeCode&&IBGE_CACHE.get(c.geo.ibgeCode);
  if(c.geo.ibgeCode&&!ibd){ibgeCity(c.geo.ibgeCode).then(d=>{if(d){LSig='';renderReal();}});}
  if(ibd){
    const sm=ibgeSamples(c)||[];const many=ibd.bairros.length>25;
    ibd.bairros.forEach((b,i)=>{
      const smp=sm[i]?sm[i].pts:[];const cf=smp.length?smp.filter(p=>coveredAt(c,p.x,p.y)).length/smp.length:0;
      const lyr=L.polygon(b.rings,{color:cf>0?'#0f9a8d':'#3b4a52',weight:1.5,fillColor:cf>0?'#7dcfae':'#a3cf78',fillOpacity:.12+cf*.25});
      lyr.bindTooltip(esc(b.nome),{permanent:!many||i<15,direction:'center',className:'bairro-tip'});
      lyr.addTo(LLayers);
    });
  }
  // bairros do jogo
  if(!ibd)c.geo.bairros.forEach((b,j)=>{
    const fib=c.fiber.ctos.includes(j);
    L.circleMarker([b.lat,b.lon],{radius:4,color:fib?'#f0a81a':'#1e2a30',weight:2,fillColor:'#fff',fillOpacity:1,interactive:false})
      .bindTooltip(`${esc(c.bairros[j])}`,{permanent:true,direction:'top',offset:[0,-6],className:'bairro-tip'}).addTo(LLayers);
  });
  // casas do jogo: assinantes em destaque
  const hp=homesPerLot(c);
  for(const l of c.lots){
    if(l.t!=='house')continue;const hr=rng(hash(c.name+':'+l.x+':'+l.y)),g=gridToGeo(c.geo,l.x+0.5+(hr()-.5)*.6,l.y+0.5+(hr()-.5)*.6),sub=isSub(l),cov=coverOf(c,l)||fiberAt(c,l);
    L.circleMarker([g.lat,g.lon],{radius:sub?6:4,color:'#fff',weight:1.5,fillColor:sub?(l.tech==='fiber'?'#e5a21e':l.st==='client'?'#0f9a8d':'#cf3b3b'):cov?'#7dcfae':'#9aa59a',fillOpacity:sub?1:.8})
      .on('click',ev=>{if(S.phase==='sede'||(draft&&draft.picking)){onMapClick(ev);return;}L.popup().setLatLng(ev.latlng).setContent(`<b>Casa de ${esc(l.fam.name)}</b><br>${esc(c.bairros[bairroOf(l)])} · representa ≈ ${Math.round(hp)} domicílios<br>${sub?'Assinante':cov?'Com sinal: dá para vender':'Sem sinal'}`).openOn(LM);}).addTo(LLayers);
  }
  // torres com leque
  for(const t of c.towers){
    const g=towerGeo(c,t),over=towerLoad(c,t)>cap(),m=tRange(t)*lm,col=t.off?'#888':over?'#cf3b3b':'#0f9a8d';
    if(t.beam&&t.beam<360)L.polygon(sectorLatLngs(g.lat,g.lon,t.az,t.beam,m),{color:col,weight:2,fillOpacity:t.off?0.03:0.1,dashArray:t.off?'6 6':null,interactive:false}).addTo(LLayers);
    else L.circle([g.lat,g.lon],{radius:m,color:col,weight:2,fillOpacity:t.off?0.03:0.08,dashArray:t.off?'6 6':null,interactive:false}).addTo(LLayers);
    L.marker([g.lat,g.lon],{icon:mkIcon(towerSvg,34),title:t.ssid}).bindPopup(`<b>Torre ${esc(t.ssid)}</b>${t.place?` · ${esc(t.place)}`:''}<br>${t.off?'Desligada':'No ar'} · ${towerLoad(c,t)}/${cap()} clientes<br>${t.beam&&t.beam<360?`Setorial ${t.beam}° apontada para ${t.az}° ${compass(t.az)}`:'Omni (360°)'} · alcance ≈ ${(m/1000).toFixed(1).replace('.',',')} km${t.h?`<br>Torre de ${t.h} m em terreno de ${t.m2} m²`:''}`).addTo(LLayers);
  }
  if(S.sede&&S.sede.ci===c.idx){const g=S.sede.lat!=null?{lat:S.sede.lat,lon:S.sede.lon}:lotGeo(c,{x:S.sede.x,y:S.sede.y});L.marker([g.lat,g.lon],{icon:mkIcon(sedeSvg(false),36),title:'Sede'}).bindPopup(`<b>Sede da ${esc(S.company)}</b><br>${esc(c.bairros[S.sede.b])}${S.sede.addr?' · '+esc(S.sede.addr):''}`).addTo(LLayers);}
  if(c.store){const g=lotGeo(c,c.store);L.marker([g.lat,g.lon],{icon:mkIcon(storeSvg,30),title:'Loja filial'}).bindPopup('<b>Loja filial</b>').addTo(LLayers);}
  drawSedePick();
  if(fit){const h=c.geo.side/2,dLat=h/mPerLat,dLon=h/mPerLon(c.geo.lat);LM.fitBounds([[c.geo.lat-dLat,c.geo.lon-dLon],[c.geo.lat+dLat,c.geo.lon+dLon]],{padding:[4,4]});}
  if(draft)drawDraft(c);
}
document.addEventListener('click',e=>{
  if(!S)return;const c=city();
  const sz=e.target.closest('[data-dsize]');if(sz&&draft){draft.sizeIdx=+sz.dataset.dsize;applyDraftSize(c);drawDraft(c);renderDraftPanel(c);queueBuildingCount(c);return;}
  const bm=e.target.closest('[data-dbeam]');if(bm&&draft){draft.beam=+bm.dataset.dbeam;drawDraft(c);renderDraftPanel(c);queueBuildingCount(c);return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='geoLoad'){geoLoad(c,{rename:c.namesAuto});}
  else if(act==='newTower'){if(!c.geo)return;clearDraft();draft={picking:true};renderReal();renderDraftPanel(c);}
  else if(act==='draftHere'){if(!lastClick)return;LM.closePopup();draft=null;setDraftAt(c,lastClick.lat,lastClick.lon);renderReal();}
  else if(act==='cancelDraft'){clearDraft();renderReal();}
  else if(act==='bestAz'){if(!draft)return;draft.az=bestAzimuth(c,draft);drawDraft(c);renderDraftPanel(c);queueBuildingCount(c);}
  else if(act==='buyDraft'){
    if(!draft)return;const block=signupBlock(c);if(block){openModal(head('Torre','Ainda não dá')+blockNotice(c,block));return;}
    const total=draft.land+(S.kits>0?KIT_COST:EQUIP_COST);if(S.money<total){toast(`Falta caixa: precisa de ${brl0(total)}.`);return;}
    let lot=null,bd=1e9;for(const l of c.lots){const d=Math.hypot(l.x+.5-draft.gx,l.y+.5-draft.gy);if(d<bd){bd=d;lot=l;}}
    openApConfig(c,lot,{...draft});
  }
  else if(act==='gpsMe'){getPosition().then(pos=>{if(!LM)return;if(meMarker)meMarker.remove();meMarker=L.circleMarker([pos.lat,pos.lon],{radius:8,color:'#fff',weight:3,fillColor:'#2f6fed',fillOpacity:1}).addTo(LM).bindPopup('Você está aqui');LM.setView([pos.lat,pos.lon],16);}).catch(()=>toast('Não deu para pegar sua localização.'));}
});
/* ===================== App instalável e offline ===================== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('App instalado!');});
function setOnline(){document.body.classList.toggle('is-offline',!navigator.onLine);}
window.addEventListener('online',()=>{setOnline();});
window.addEventListener('offline',()=>{setOnline();toast('Sem internet: o jogo continua e salva no aparelho.');});
window.addEventListener('pagehide',()=>{if(S)save(false);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S)save(false);});
function showUpdateBar(reg){
  if(document.querySelector('.update-bar'))return;
  const bar=document.createElement('div');bar.className='update-bar';bar.setAttribute('role','status');
  bar.innerHTML='<span>Nova versão do jogo disponível.</span><button class="btn small primary">Atualizar</button>';
  bar.querySelector('button').onclick=()=>{if(S)save(false);if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');};
  document.body.appendChild(bar);
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',async()=>{
    try{
      const hadController=!!navigator.serviceWorker.controller;
      const reg=await navigator.serviceWorker.register('sw.js');
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdateBar(reg);
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateBar(reg);});});
      let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||!hadController)return;reloaded=true;location.reload();});
      setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
    }catch(e){}
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}
  });
}
setOnline();
function loop(){clearTimeout(timer);const sp=S?S.speed:1;timer=setTimeout(()=>{if(S&&sp>0&&!modalOpen)tick();loop();},sp>0?1000/sp:500);}
function autoGeo(){if(!S)return;const c=city();if(!c.geo&&!geoBusy.has(c)&&navigator.onLine&&!c.geoError)geoLoad(c,{rename:c.namesAuto!==false&&!S.sede});}
function start(data){
  setTab('map');
  S=(data&&validSave(data.S))?data.S:loadLocal();
  if(S){migrate(S);for(const c of S.cities)for(const l of c.lots)if(l.st==='pending'&&!l.deal)l.st='none';renderAll();}
  else showStart();
  loop();
  initCloud();
  setTimeout(autoGeo,600);
}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function'){try{window.claude.hot.snapshot(()=>({S}));}catch(e){}}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
